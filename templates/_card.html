<article class="card">
  {% if post.tags %}
  <div class="card-tags">
    {% for tag in post.tags %}
      <a class="chip chip-sm" href="/tags/{{ tag|slugify }}/">{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}
  <h2><a href="{{ post.url|safe }}">{{ post.title }}</a></h2>
  <p>{{ post.summary }}</p>
  <div class="meta">
    {% if post.date_display %}<time datetime="{{ post.datetime }}">{{ post.date_display }}</time>{% endif %}
    {% if post.reading_minutes %}<span aria-hidden="true">·</span><span>{{ post.reading_minutes }} dk okuma</span>{% endif %}
  </div>
</article>
