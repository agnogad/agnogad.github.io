{% extends "base.html" %}
{% block content %}
<div class="container page-pad">
  <header class="list-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    <p class="list-count">{{ pages|length }} yazı</p>
  </header>
  <div class="post-grid">
    {% for post in pages %}{% include "_card.html" %}{% endfor %}
  </div>
</div>
{% endblock %}
